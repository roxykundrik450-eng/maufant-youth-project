<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500"
     role="img" aria-label="Stylised outline of the Island of Jersey">
  <!--
    Stylised Jersey, north at top.
    Landmarks: Grosnez (NW), Corbière (SW), St Aubin's Bay (south-west, concave),
    St Helier (SE), Royal Bay & St Catherine's (NE).
  -->
  <defs>
    <linearGradient id="islandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FCBD9"/>
      <stop offset="55%" stop-color="#3FA9BF"/>
      <stop offset="100%" stop-color="#12708C"/>
    </linearGradient>
  </defs>

  <path fill="url(#islandFill)" d="
    M 118 44
    C 138 34, 168 38, 192 30
    C 214 23, 236 30, 252 44
    C 268 58, 286 62, 300 74
    C 314 86, 330 96, 340 114
    C 350 132, 356 158, 352 184
    C 348 206, 340 222, 334 238
    C 330 250, 336 258, 330 268
    C 322 282, 306 288, 292 286
    C 280 284, 274 276, 264 274
    C 250 271, 240 278, 228 276
    C 214 274, 206 264, 196 258
    C 184 251, 174 252, 166 244
    C 156 234, 160 222, 160 210
    C 160 198, 152 192, 146 182
    C 138 170, 142 158, 138 146
    C 132 130, 118 124, 108 128
    C 96 133, 92 148, 84 154
    C 74 162, 62 160, 54 150
    C 44 138, 46 122, 52 110
    C 58 96, 56 80, 66 66
    C 76 52, 100 54, 118 44
    Z"/>

  <!-- St Aubin's Bay — the notable concave bite out of the south-west -->
  <path fill="currentColor" opacity="0.001"/>
  <path fill="rgba(255,255,255,0.16)" d="
    M 108 128
    C 96 133, 92 148, 84 154
    C 74 162, 62 160, 54 150
    C 58 172, 66 186, 78 194
    C 88 200, 96 208, 104 204
    C 112 200, 112 186, 118 172
    C 124 158, 134 150, 146 142
    C 150 132, 126 122, 108 128
    Z"/>

  <!-- Grèves de Lecq notch (north-west of St Aubin's) -->
  <path fill="rgba(255,255,255,0.14)" d="
    M 118 44
    C 130 62, 126 82, 132 100
    C 136 112, 144 116, 152 118
    C 162 120, 168 112, 166 102
    C 163 86, 158 66, 150 50
    C 142 34, 128 36, 118 44 Z"/>

  <!-- Town dots -->
  <g fill="#F2F7F8">
    <circle cx="212" cy="268" r="5.5"/>   <!-- St Helier -->
    <circle cx="86" cy="170" r="4"/>      <!-- St Aubin -->
    <circle cx="158" cy="70" r="4"/>      <!-- Gorey / Trinity area -->
    <circle cx="330" cy="158" r="4"/>     <!-- St Martin / Rozel -->
    <circle cx="252" cy="96" r="4"/>      <!-- St Ouen's Bay coast -->
  </g>

  <!-- Maufant marker (St Saviour, east of St Helier) -->
  <g transform="translate(240,240)">
    <circle r="9" fill="#E8A33D"/>
    <circle r="4" fill="#071A28"/>
  </g>
</svg>
